<svg width="900" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d18"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fb923c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <style>
    @keyframes laserScan {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { transform: translateY(200px); opacity: 0.2; }
    }
    @keyframes pulseText {
      0%, 100% { filter: drop-shadow(0 0 6px #fb923c66); }
      50% { filter: drop-shadow(0 0 16px #fb923ccc); }
    }
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      letter-spacing: 5px;
      animation: pulseText 3.5s infinite ease-in-out;
    }
    .laser {
      animation: laserScan 4.5s infinite linear;
    }
  </style>

  <rect width="900" height="200" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="900" height="200" rx="12" fill="url(#grid)"/>

  <!-- Ambient Light -->
  <circle cx="200" cy="100" r="100" fill="#f43f5e" opacity="0.1" filter="url(#glow)"/>
  <circle cx="700" cy="100" r="100" fill="#38bdf8" opacity="0.1" filter="url(#glow)"/>

  <!-- Laser Scanline -->
  <line x1="30" y1="0" x2="870" y2="0" stroke="url(#laserGrad)" stroke-width="1.5" class="laser"/>

  <!-- Top / Bottom Borders -->
  <line x1="120" y1="1" x2="780" y2="1" stroke="url(#laserGrad)" stroke-width="2"/>
  <line x1="180" y1="199" x2="720" y2="199" stroke="url(#laserGrad)" stroke-width="1.5"/>

  <!-- Corner Reticles -->
  <path d="M 16 30 L 16 16 L 30 16" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.8"/>
  <path d="M 884 30 L 884 16 L 870 16" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.8"/>
  <path d="M 16 170 L 16 184 L 30 184" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.8"/>
  <path d="M 884 170 L 884 184 L 870 184" fill="none" stroke="#fb923c" stroke-width="2" opacity="0.8"/>

  <!-- Protocol Badge -->
  <g transform="translate(450, 36)">
    <rect x="-130" y="-11" width="260" height="22" rx="4" fill="#0d1726" stroke="#fb923c" stroke-width="0.8"/>
    <circle cx="-112" cy="0" r="3" fill="#fb923c"/>
    <text x="-98" y="4" font-family="'Segoe UI', monospace" font-size="10.5" font-weight="700" fill="#fb923c" letter-spacing="2">INTELLIGENT HEALTH // FASTAPI + STREAMLIT</text>
  </g>

  <!-- Title -->
  <text x="450" y="98" text-anchor="middle" font-size="34" fill="url(#textGrad)" class="title">
    STRESS DETECTION AI
  </text>

  <!-- Subtitle -->
  <text x="450" y="136" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#94a3b8" letter-spacing="2">
    MULTI-MODAL ML PIPELINE // BIOMETRIC &amp; BEHAVIORAL ANALYTICS
  </text>

  <!-- Bottom Accent Tagline -->
  <text x="450" y="170" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="500" fill="#f43f5e" letter-spacing="1">
    ⚡ High-Precision Engineering  |  Interactive Architecture  |  Real-Time Performance ⚡
  </text>
</svg>